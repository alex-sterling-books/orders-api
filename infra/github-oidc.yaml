AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions in one repository deploy the Orders API lab without
  stored AWS keys. Lab only: the role is broad, so keep it in a dedicated
  test account and limit it to one repository and one environment.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organization that owns the repository.
  GitHubRepo:
    Type: String
    Default: orders-api
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the GitHub OIDC provider.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: orders-api-github-deploy
      Description: Assumed by GitHub Actions to deploy the Orders API lab.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:production
      # Lab shortcut: SAM creates IAM roles, Lambda functions, an API, a table,
      # an alarm, and a topic. A least-privilege policy for all of that is long.
      # In a real account, replace this with a scoped policy.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
      Tags:
        - Key: app
          Value: orders-api

Outputs:
  DeployRoleArn:
    Description: Store this as the repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
